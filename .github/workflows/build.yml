name: Build Smart GIF Android App

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Pre-generate Debug Keystore for Signing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug & Release APK
        run: |
          echo "=== STARTING ASSEMBLE DEBUG ==="
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build_debug.log
          DEBUG_EXIT=${PIPESTATUS[0]}
          if [ $DEBUG_EXIT -ne 0 ]; then
            echo "assembleDebug failed with exit code $DEBUG_EXIT"
            exit $DEBUG_EXIT
          fi

          echo "=== STARTING ASSEMBLE RELEASE ==="
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build_release.log
          RELEASE_EXIT=${PIPESTATUS[0]}
          if [ $RELEASE_EXIT -ne 0 ]; then
            echo "assembleRelease failed with exit code $RELEASE_EXIT"
            exit $RELEASE_EXIT
          fi

      - name: Post Failure Log on Error
        if: failure()
        run: |
          LOG_CONTENT=""
          if [ -f build_debug.log ]; then
            LOG_CONTENT=$(tail -n 80 build_debug.log)
          fi
          if [ -f build_release.log ]; then
            LOG_CONTENT=$(tail -n 80 build_release.log)
          fi
          echo "### ❌ Build Failure Details" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$LOG_CONTENT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="### ❌ Build Failure Log
          \`\`\`
          $LOG_CONTENT
          \`\`\`" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build-artifacts
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-artifacts/ \;
          ls -lh build-artifacts/

      - name: Upload APKs to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartGIF-Android-APKs
          path: build-artifacts/*.apk
          retention-days: 30

      - name: Generate Build Summary
        run: |
          echo "### 🚀 Smart GIF 생성기 안드로이드 빌드 완료!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 파일명 | 크기 | 설명 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in build-artifacts/*.apk; do
            if [ -f "$f" ]; then
              SZ=$(du -h "$f" | cut -f1)
              BN=$(basename "$f")
              echo "| \`$BN\` | $SZ | 안드로이드 패키지 |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 상단의 **Artifacts** 탭에서 APK 파일을 다운로드하여 스마트폰에 바로 설치할 수 있습니다." >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release (when pushing tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
          name: Smart GIF Maker ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
